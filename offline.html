<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Pagina offline di Petite Mood.">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#e7387c">
  <title>Petite Mood — Offline</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;margin:0;display:grid;place-items:center;padding:24px;background:#fff4f8;color:#2d2d2d;font-family:Arial,sans-serif;text-align:center}.card{max-width:520px;padding:40px 28px;border-radius:24px;background:#fff;box-shadow:0 18px 55px rgba(92,35,60,.14)}img{width:82px;height:82px}h1{margin:20px 0 12px;font-size:2rem}p{line-height:1.6;color:#665b60}button{margin-top:16px;padding:13px 24px;border:0;border-radius:999px;background:#e7387c;color:#fff;font:700 1rem Arial;cursor:pointer}
  </style>
</head>
<body>
  <main class="card">
    <img src="/images/pwa/icon-192.png" alt="">
    <h1>Ci rivediamo tra poco 💗</h1>
    <p>In questo momento sei offline. Controlla la connessione e torna a Petite Mood.</p>
    <button type="button" onclick="location.reload()">Riprova</button>
  </main>
</body>
</html>
